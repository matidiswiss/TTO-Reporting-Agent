<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>TTO Reporting Agent — Login</title>
  <style>
    :root {
      --bg: #f7f8f6;
      --surface: #ffffff;
      --text: #1a1f1c;
      --muted: #5f6b64;
      --accent: #158158;
      --accent-soft: #e8f3ed;
      --border: #dde5df;
      --danger: #b91c1c;
      --danger-soft: #fef2f2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
    }

    .badge {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      margin-bottom: 16px;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(21, 129, 88, 0.15);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error {
      display: none;
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .error.visible { display: block; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">TTO Reporting Agent</div>
    <h1>Masuk</h1>
    <p>Gunakan username dan password untuk mengakses dashboard reporting.</p>
    <div id="error" class="error" role="alert"></div>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit" id="submit-btn">Masuk</button>
    </form>
  </main>

  <script type="module">
    import { DASHBOARD_PATH, getSession, login } from './js/auth.js';

    if (getSession()?.ok) {
      window.location.replace(DASHBOARD_PATH);
    }

    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    const submitBtn = document.getElementById('submit-btn');

    const ERROR_COPY = {
      invalid_credentials: 'Username atau password salah.',
      credentials_required: 'Username dan password wajib diisi.',
      account_disabled: 'Akun dinonaktifkan.',
      default: 'Gagal masuk. Coba lagi.',
    };

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.classList.remove('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Memproses...';

      try {
        await login(
          document.getElementById('username').value.trim(),
          document.getElementById('password').value
        );
        window.location.replace(DASHBOARD_PATH);
      } catch (err) {
        const msg = ERROR_COPY[err.code] || ERROR_COPY.default;
        errorEl.textContent = msg;
        errorEl.classList.add('visible');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
